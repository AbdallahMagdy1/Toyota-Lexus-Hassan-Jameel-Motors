name: hj_mobile
description: "Hassan Jameel mobile app — Toyota, Saudi Arabia."
publish_to: 'none'
version: 1.0.0+14

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management — everything (theme, locale, auth, onboarding) is BLoC/Cubit.
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # DI / routing / network / storage — same layering as the website cycle.
  get_it: ^8.2.0
  go_router: ^16.2.4
  dio: ^5.9.0
  shared_preferences: ^2.5.3

  # Finance-request document uploads (gallery → base64), like the website's
  # FileField.
  image_picker: ^1.2.1
  # Image OR PDF finance documents (the website FileField accepts both).
  file_picker: ^10.0.0

  # Dashboard-controlled video banners (auth / welcome placements).
  video_player: ^2.10.0

  # UI polish
  flutter_animate: ^4.5.2

  # MD5 password hashing — identical to the website's auth cycle.
  crypto: ^3.0.6
  intl: any

  # FCM — same Firebase project + token cycle as the old app.
  firebase_core: ^4.2.1
  firebase_messaging: ^16.1.1
  flutter_local_notifications: ^19.3.1

  # Maps links (contact branches) + payment/invoice links.
  url_launcher: ^6.3.2

  # Payment gateway pages (MyFatoorah/Tabby/Tamara) — same cycle as the
  # website: backend creates the session, the app only renders the URL.
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Generates Android/iOS launcher icons per brand — see
  # flutter_launcher_icons-toyota.yaml / flutter_launcher_icons-lexus.yaml.
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/logos/

  fonts:
    # Univers Next Arabic — the website's brand typeface (public/fonts/
    # nextFont), covering Latin + Arabic from one family so both locales
    # render in the same voice. Only Regular/Bold ship, so Flutter snaps
    # w500/w600 to 400 and w800/w900 to 700.
    - family: UniversNextArabic
      fonts:
        - asset: assets/fonts/UniversNextArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/UniversNextArabic-Bold.ttf
          weight: 700

    # The website's icomoon font — carries the Saudi Riyal symbol at U+E900
    # (public/fonts/icomoon), rendered before every price like <CurrencyCode>.
    - family: icomoon
      fonts:
        - asset: assets/fonts/icomoon.ttf
